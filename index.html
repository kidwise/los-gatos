<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f3ecdf" />
    <link rel="icon" href="data:," />
    <title>Los Gatos: A Wandering</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #f3ecdf; }
      canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
      .hud {
        position: fixed; left: 0; right: 0; pointer-events: none; user-select: none;
        font-family: "Playfair Display", Georgia, serif; color: #3a3542; text-align: center;
        text-shadow: 0 0 6px #f3ecdf, 0 0 14px #f3ecdf;
      }
      #title { top: max(16px, env(safe-area-inset-top)); left: 20px; right: auto; text-align: left; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.8; }
      #title em { display: block; font-size: 22px; letter-spacing: 0.01em; text-transform: none; margin-top: 2px; }
      #hint { bottom: max(22px, env(safe-area-inset-bottom)); font-style: italic; font-size: 16px; opacity: 0.7; transition: opacity 1.2s; }
      #hint.gone { opacity: 0; }
      button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      #sketch-cta, #book-btn, #finder button, #book-close {
        font-family: "Playfair Display", Georgia, serif; color: #3a3542; background: #fbf6ea;
        border: 1.5px solid #3a3542; border-radius: 999px; padding: 10px 20px; font-size: 16px;
        box-shadow: 0 2px 0 rgba(58, 53, 66, 0.25);
      }
      #sketch-cta {
        position: fixed; left: 50%; bottom: max(64px, calc(env(safe-area-inset-bottom) + 56px)); transform: translate(-50%, 16px);
        background: #e0683f; color: #fbf6ea; border-color: #b9502c; font-style: italic; font-size: 18px; padding: 12px 26px;
        opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; white-space: nowrap;
      }
      #sketch-cta.on { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
      #book-btn { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; font-size: 14px; padding: 8px 16px; display: none; }
      body.sketching #book-btn { display: block; }

      /* Viewfinder: the page is masked with paper except for a 4:3 window. */
      #finder { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 0.35s; }
      #finder.on { opacity: 1; }
      #finder-window {
        position: absolute; left: 50%; top: 46%; width: min(88vw, 104vh); aspect-ratio: 4 / 3; transform: translate(-50%, -50%);
        box-shadow: 0 0 0 200vmax rgba(243, 236, 223, 0.82); outline: 2px solid #3a3542; outline-offset: 6px;
      }
      #finder.flash #finder-window { background: #fbf6ea; transition: background 0.1s; }
      #finder-bar { position: absolute; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
      #finder-title { flex-basis: 100%; text-align: center; font-family: "Playfair Display", Georgia, serif; font-style: italic; color: #3a3542; font-size: 15px; }
      #finder.on button { pointer-events: auto; }
      #finder-draw { background: #e0683f !important; color: #fbf6ea !important; border-color: #b9502c !important; }

      #toast {
        position: fixed; left: 50%; top: max(64px, calc(env(safe-area-inset-top) + 52px)); transform: translate(-50%, -12px); max-width: min(86vw, 460px);
        font-family: "Playfair Display", Georgia, serif; color: #3a3542; background: #fbf6ea; border: 1.5px solid #3a3542; border-radius: 14px;
        padding: 12px 18px; font-size: 16px; text-align: center; opacity: 0; pointer-events: none; transition: opacity 0.5s, transform 0.5s;
      }
      #toast.on { opacity: 1; transform: translate(-50%, 0); }
      #toast span { display: block; font-style: italic; font-size: 14px; margin-top: 4px; opacity: 0.85; }

      #book { position: fixed; inset: 0; background: #f3ecdf; overflow-y: auto; display: none; font-family: "Playfair Display", Georgia, serif; color: #3a3542; padding: 20px 16px 40px; box-sizing: border-box; }
      #book.on { display: block; }
      #book-head { max-width: 980px; margin: 0 auto 18px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
      #book-head em { font-size: 30px; }
      #book-head span { flex: 1; font-size: 14px; letter-spacing: 0.08em; opacity: 0.75; }
      #book-pages { max-width: 980px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
      #book figure { margin: 0; background: #fbf6ea; border: 1.5px solid #3a3542; border-radius: 6px; padding: 10px 10px 12px; transform: rotate(-0.4deg); }
      #book figure:nth-child(even) { transform: rotate(0.5deg); }
      #book figure img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
      #book figure.blank { border-style: dashed; opacity: 0.6; min-height: 150px; display: flex; align-items: center; justify-content: center; text-align: center; }
      #book figcaption b { display: block; font-size: 18px; margin-top: 8px; }
      #book figcaption span { display: block; font-style: italic; font-size: 14px; margin-top: 3px; }
      #book figcaption i { display: block; font-size: 11px; letter-spacing: 0.1em; opacity: 0.6; margin-top: 6px; }
      #cam-btn, #meow-btn, #book .chip, #book .remove {
        font-family: "Playfair Display", Georgia, serif; color: #3a3542; background: #fbf6ea;
        border: 1.5px solid #3a3542; border-radius: 999px; padding: 9px 18px; font-size: 15px;
        box-shadow: 0 2px 0 rgba(58, 53, 66, 0.25);
      }
      #cam-btn, #meow-btn { position: fixed; bottom: max(58px, calc(env(safe-area-inset-bottom) + 50px)); display: none; }
      #cam-btn { right: 14px; }
      #meow-btn { left: 14px; }
      body.sketching #cam-btn, body.sketching #meow-btn.on { display: block; }
      body.framing #cam-btn, body.framing #meow-btn, body.framing #hint { display: none !important; }
      #mrrp {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -70px); pointer-events: none; opacity: 0;
        font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: 22px; color: #3a3542;
        text-shadow: 0 0 6px #f3ecdf, 0 0 12px #f3ecdf;
      }
      #mrrp.on { animation: mrrp 1.3s ease-out; }
      @keyframes mrrp { 0% { opacity: 0; transform: translate(-50%, -50px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -105px); } }
      #book section { max-width: 980px; margin: 0 auto 22px; }
      #book h3 { font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; opacity: 0.7; margin: 0 0 10px; }
      #book section p { margin: 0 0 8px; font-size: 16px; font-style: italic; }
      #book section p b { font-style: normal; margin-right: 6px; }
      #book .unknown { opacity: 0.5; }
      #book .chip { margin: 0 8px 8px 0; }
      #book .chip.on { background: #3a3542; color: #fbf6ea; }
      #book .chip.unknown { border-style: dashed; box-shadow: none; }
      #book .remove { float: right; padding: 4px 12px; font-size: 12px; box-shadow: none; margin-top: 6px; }
      #exit-btn {
        position: fixed; left: 50%; top: max(70px, calc(env(safe-area-inset-top) + 60px)); transform: translateX(-50%); display: none; white-space: nowrap;
        font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: 17px; color: #fbf6ea; background: #2f4466;
        border: 1.5px solid #22324d; border-radius: 999px; padding: 11px 22px; box-shadow: 0 2px 0 rgba(58, 53, 66, 0.25);
      }
      #exit-btn.on { display: block; }
      #ride-btn {
        position: fixed; left: 50%; bottom: max(58px, calc(env(safe-area-inset-bottom) + 50px)); transform: translateX(-50%); display: none; white-space: nowrap;
        font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: 18px; color: #fbf6ea; background: #e0683f;
        border: 1.5px solid #b9502c; border-radius: 999px; padding: 12px 26px; box-shadow: 0 2px 0 rgba(58, 53, 66, 0.25);
      }
      #ride-btn.on { display: block; }
      body.framing #ride-btn { display: none; }
      body.framing #exit-btn { display: none; }
      #intro { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity 1.4s; font-family: "Playfair Display", Georgia, serif; color: #3a3542; text-align: center; }
      #intro.on { opacity: 1; }
      #intro .intro-title { position: absolute; left: 0; right: 0; top: 16%; text-shadow: 0 0 10px #f3ecdf, 0 0 26px #f3ecdf, 0 0 40px #f3ecdf; }
      #intro .intro-title span { display: block; font-size: 15px; letter-spacing: 0.42em; text-transform: uppercase; }
      #intro .intro-title em { display: block; font-size: min(64px, 13vw); margin-top: 4px; }
      #intro .intro-go { position: absolute; left: 0; right: 0; bottom: 14%; font-style: italic; font-size: 18px; text-shadow: 0 0 8px #f3ecdf, 0 0 18px #f3ecdf; animation: breathe 2.6s ease-in-out infinite; }
      @keyframes breathe { 50% { opacity: 0.45; } }
      body:has(#intro.on) #title, body:has(#intro.on) #book-btn, body:has(#intro.on) #cam-btn, body:has(#intro.on) #sound-btn, body:has(#intro.on) #ride-btn { visibility: hidden; }
      #ending {
        position: fixed; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px); width: min(88vw, 440px); box-sizing: border-box;
        font-family: "Playfair Display", Georgia, serif; color: #3a3542; background: #fbf6ea; border: 1.5px solid #3a3542; border-radius: 16px;
        padding: 18px 22px; text-align: center; opacity: 0; pointer-events: none; transition: opacity 1.2s, transform 1.2s;
      }
      #ending.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
      #ending em { display: block; font-size: 24px; }
      #ending p { margin: 8px 0 0; font-size: 15px; font-style: italic; }
      #ending #ending-tally { font-style: normal; font-size: 13px; letter-spacing: 0.06em; opacity: 0.75; }
      #ending button { margin-top: 14px; font: inherit; font-size: 15px; color: #3a3542; background: #fbf6ea; border: 1.5px solid #3a3542; border-radius: 999px; padding: 8px 20px; }
      body:has(#ending.on) #cam-btn, body:has(#ending.on) #meow-btn, body:has(#ending.on) #hint, body:has(#ending.on) #ride-btn { visibility: hidden; }
      #sound-btn {
        position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; font-family: "Playfair Display", Georgia, serif; color: #3a3542;
        background: #fbf6ea; border: 1.5px solid #3a3542; border-radius: 999px; padding: 8px 14px; font-size: 13px; box-shadow: 0 2px 0 rgba(58, 53, 66, 0.25);
      }
      body.sketching #sound-btn { right: 112px; }
      body.framing #sound-btn { display: none; }
      #credit { bottom: max(6px, env(safe-area-inset-bottom)); right: 10px; left: auto; text-align: right; font-size: 10px; opacity: 0.55; }
    </style>
  </head>
  <body>
    <div id="title" class="hud">Style study<em>The Corner</em></div>
    <div id="hint" class="hud">Hold to walk · tap to go · pinch to zoom</div>
    <div id="credit" class="hud"></div>
    <button id="sound-btn"></button>
    <button id="exit-btn"></button>
    <button id="ride-btn"></button>
    <div id="intro">
      <div class="intro-title"><span>Los Gatos</span><em>A Wandering</em></div>
      <div class="intro-go">Touch anywhere to wake up</div>
    </div>
    <div id="ending">
      <em>The end of the trail, for today</em>
      <p>From the plaza cedar to the dam, with the mountains behind it all.</p>
      <p id="ending-tally"></p>
      <button id="ending-close">Keep wandering</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
